[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "vectormind-engine"
version = "0.1.0"
description = "VectorMind engine — faithful Python port of the C++ Your-OWN-AI vector database"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "ingestion*", "clients*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
